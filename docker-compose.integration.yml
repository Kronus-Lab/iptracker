services:
  powerdns:
    image: powerdns/pdns-auth-49:latest
    environment:
      PDNS_AUTH_API_KEY: testapikey
    ports:
      - "8081:8081"
      - "1053:53"
      - "1053:53/udp"

  ntfy:
    image: binwiederhier/ntfy:latest
    command: serve
    ports:
      - "8082:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --tries=1 http://localhost:80/v1/health -O - | grep -Eo '\"healthy\"\\s*:\\s*true' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
